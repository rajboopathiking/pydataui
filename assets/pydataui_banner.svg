<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="glowViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="glowEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="none" stroke="#1f2937" stroke-width="2" />

  <!-- Ambient Glow Spots -->
  <circle cx="200" cy="100" r="180" fill="url(#glowViolet)" />
  <circle cx="1000" cy="300" r="220" fill="url(#glowEmerald)" />

  <!-- Top Badge -->
  <g transform="translate(60, 42)">
    <rect width="180" height="28" rx="14" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#10b981" />
    <text x="28" y="18" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">PYDATAUI v1.3.1</text>
  </g>

  <!-- Main Title & Hook -->
  <text x="60" y="125" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
    Streamlit Simplicity. Next.js Performance.
  </text>
  <text x="60" y="165" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
    The unified full-stack Python framework for rapid AI prototypes, interactive dashboards, and production SaaS.
  </text>

  <!-- 4 Feature Cards -->
  <!-- Card 1: Streamlit Track -->
  <g transform="translate(60, 205)">
    <rect width="250" height="170" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <rect x="0" y="0" width="250" height="4" rx="2" fill="#3b82f6" />
    <text x="20" y="36" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">TRACK 1: PROTOTYPING</text>
    <text x="20" y="66" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Streamlit Simplicity</text>
    <text x="20" y="96" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="13">✓ pdu.write(df)</text>
    <text x="20" y="118" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="13">✓ with pdu.sidebar():</text>
    <text x="20" y="140" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">⚡ 0 Script Re-Runs</text>
  </g>

  <!-- Card 2: Next.js Track -->
  <g transform="translate(330, 205)">
    <rect width="250" height="170" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <rect x="0" y="0" width="250" height="4" rx="2" fill="#8b5cf6" />
    <text x="20" y="36" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">TRACK 2: FULL-STACK SAAS</text>
    <text x="20" y="66" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Next.js Architecture</text>
    <text x="20" y="96" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="13">✓ @app.page() &amp; AppShell</text>
    <text x="20" y="118" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="13">✓ @s.action (Server Actions)</text>
    <text x="20" y="140" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">⚡ 0ms Memory Latency</text>
  </g>

  <!-- Card 3: Direct FastAPI Mount -->
  <g transform="translate(600, 205)">
    <rect width="250" height="170" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <rect x="0" y="0" width="250" height="4" rx="2" fill="#10b981" />
    <text x="20" y="36" fill="#34d399" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">NATIVE MOUNTING</text>
    <text x="20" y="66" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">FastAPI Native ASGI</text>
    <text x="20" y="96" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="13">✓ app.mount('/ui', pdu)</text>
    <text x="20" y="118" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="13">✓ Auto Swagger UI (/docs)</text>
    <text x="20" y="140" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">⚡ 1 Process, 1 Port</text>
  </g>

  <!-- Card 4: 20 Modern Themes -->
  <g transform="translate(870, 205)">
    <rect width="270" height="170" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <rect x="0" y="0" width="270" height="4" rx="2" fill="#f59e0b" />
    <text x="20" y="36" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">DESIGN SYSTEM</text>
    <text x="20" y="66" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">20 Themes &amp; Dark Mode</text>
    <!-- Color Swatches Row 1 -->
    <g transform="translate(20, 90)">
      <circle cx="8" cy="8" r="8" fill="#18181b" stroke="#52525b" stroke-width="1.5" />
      <circle cx="32" cy="8" r="8" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
      <circle cx="56" cy="8" r="8" fill="#7c3aed" />
      <circle cx="80" cy="8" r="8" fill="#4f46e5" />
      <circle cx="104" cy="8" r="8" fill="#2563eb" />
      <circle cx="128" cy="8" r="8" fill="#0891b2" />
      <circle cx="152" cy="8" r="8" fill="#059669" />
      <circle cx="176" cy="8" r="8" fill="#16a34a" />
      <circle cx="200" cy="8" r="8" fill="#d97706" />
      <circle cx="224" cy="8" r="8" fill="#e11d48" />
    </g>
    <!-- Color Swatches Row 2 -->
    <g transform="translate(20, 114)">
      <circle cx="8" cy="8" r="8" fill="#1c1917" stroke="#78716c" stroke-width="1.5" />
      <circle cx="32" cy="8" r="8" fill="#171717" stroke="#737373" stroke-width="1.5" />
      <circle cx="56" cy="8" r="8" fill="#9333ea" />
      <circle cx="80" cy="8" r="8" fill="#c026d3" />
      <circle cx="104" cy="8" r="8" fill="#db2777" />
      <circle cx="128" cy="8" r="8" fill="#dc2626" />
      <circle cx="152" cy="8" r="8" fill="#ea580c" />
      <circle cx="176" cy="8" r="8" fill="#ca8a04" />
      <circle cx="200" cy="8" r="8" fill="#0d9488" />
      <circle cx="224" cy="8" r="8" fill="#111827" stroke="#9ca3af" stroke-width="1.5" />
    </g>
    <text x="20" y="152" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">🎨 Unlimited Custom Palettes</text>
  </g>
</svg>
