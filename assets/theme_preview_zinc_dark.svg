<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Dark Background -->
    <linearGradient id="zBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#121215" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Chart Fill -->
    <linearGradient id="zChartCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <filter id="zShadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Window Frame -->
  <rect width="1000" height="600" rx="14" fill="url(#zBg)" stroke="#27272a" stroke-width="1.5" />

  <!-- Window Header / Browser Chrome -->
  <rect width="1000" height="42" rx="14" fill="#18181b" />
  <rect y="30" width="1000" height="12" fill="#18181b" />
  <circle cx="22" cy="21" r="5" fill="#ef4444" />
  <circle cx="38" cy="21" r="5" fill="#eab308" />
  <circle cx="54" cy="21" r="5" fill="#22c55e" />

  <!-- Browser URL Bar -->
  <rect x="220" y="8" width="460" height="26" rx="6" fill="#09090b" stroke="#3f3f46" stroke-width="1" />
  <circle cx="236" cy="21" r="4" fill="#38bdf8" />
  <text x="248" y="25" fill="#e4e4e7" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">http://127.0.0.1:8000/telemetry</text>
  <text x="618" y="25" fill="#a1a1aa" font-family="monospace" font-size="10">pdu.dx: SSR</text>

  <!-- Theme Active Pill -->
  <rect x="795" y="9" width="185" height="24" rx="12" fill="#27272a" stroke="#52525b" stroke-width="1" />
  <circle cx="810" cy="21" r="4" fill="#ffffff" />
  <text x="822" y="25" fill="#f4f4f5" font-family="monospace" font-size="11" font-weight="700">theme="zinc" (Dark)</text>

  <!-- ================= LAYOUT ================= -->

  <!-- LEFT SIDEBAR -->
  <g transform="translate(0, 42)">
    <rect width="240" height="558" fill="#121215" stroke="#27272a" stroke-width="1" />

    <!-- Brand -->
    <text x="24" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">Cluster Telemetry</text>
    <text x="24" y="49" fill="#71717a" font-family="-apple-system, sans-serif" font-size="10">Kubernetes H100 Mesh</text>
    <line x1="24" y1="62" x2="216" y2="62" stroke="#27272a" stroke-width="1" />

    <!-- Cluster Selector -->
    <text x="24" y="86" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">ACTIVE CLUSTER</text>
    <rect x="24" y="96" width="192" height="30" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <circle cx="38" cy="111" r="4" fill="#22c55e" />
    <text x="48" y="115" fill="#f4f4f5" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">us-east-h100-prod</text>

    <!-- Side Menu -->
    <g transform="translate(24, 146)">
      <!-- Item 1 (Active) -->
      <rect width="192" height="30" rx="6" fill="#27272a" />
      <text x="14" y="19" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">📊 Overview &amp; Health</text>

      <!-- Item 2 -->
      <text x="14" y="52" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="11">🖥️ GPU Nodes (16)</text>

      <!-- Item 3 -->
      <text x="14" y="82" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="11">📦 Active Pods (128)</text>

      <!-- Item 4 -->
      <text x="14" y="112" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="11">⚡ Token Throughput</text>

      <!-- Item 5 -->
      <text x="14" y="142" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="11">🚨 Alert Channels (0)</text>

      <!-- Item 6 -->
      <text x="14" y="172" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="11">🛠️ OpenAPI REST /docs</text>
    </g>

    <!-- Hardware Resource Gauge -->
    <g transform="translate(24, 380)">
      <rect width="192" height="150" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="14" y="24" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Cluster Resources</text>

      <text x="14" y="48" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="10">CPU Allocation (48%)</text>
      <rect x="14" y="54" width="164" height="6" rx="3" fill="#27272a" />
      <rect x="14" y="54" width="78" height="6" rx="3" fill="#38bdf8" />

      <text x="14" y="78" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="10">VRAM Usage (88%)</text>
      <rect x="14" y="84" width="164" height="6" rx="3" fill="#27272a" />
      <rect x="14" y="84" width="144" height="6" rx="3" fill="#a855f7" />

      <text x="14" y="108" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="10">PCIe Bandwidth (94%)</text>
      <rect x="14" y="114" width="164" height="6" rx="3" fill="#27272a" />
      <rect x="14" y="114" width="154" height="6" rx="3" fill="#22c55e" />

      <text x="14" y="138" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">All 16 nodes operating at 100%</text>
    </g>
  </g>

  <!-- MAIN TELEMETRY CONTENT -->
  <g transform="translate(240, 42)">
    <!-- Main Top Bar -->
    <rect width="760" height="52" fill="#121215" stroke="#27272a" stroke-width="1" />
    <circle cx="28" cy="26" r="5" fill="#22c55e" />
    <text x="42" y="27" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Real-Time Cluster Telemetry</text>
    <text x="42" y="42" fill="#71717a" font-family="-apple-system, sans-serif" font-size="10">Streaming in-process telemetry • 0ms API overhead</text>

    <!-- Action Buttons -->
    <g transform="translate(480, 12)">
      <rect width="120" height="28" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="60" y="18" fill="#e4e4e7" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">📥 Export Parquet</text>

      <rect x="130" width="130" height="28" rx="6" fill="#f43f5e" />
      <text x="195" y="18" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ Drain &amp; Rebalance</text>
    </g>

    <!-- 4 Metric Cards -->
    <g transform="translate(24, 68)">
      <!-- Metric 1 -->
      <rect width="168" height="68" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1.2" />
      <text x="14" y="20" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">P99 Inference Latency</text>
      <text x="14" y="46" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">12.8 ms</text>
      <text x="100" y="46" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">-2.4ms</text>

      <!-- Metric 2 -->
      <g transform="translate(180, 0)">
        <rect width="168" height="68" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1.2" />
        <text x="14" y="20" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">VRAM Allocated</text>
        <text x="14" y="46" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">1,180 GB</text>
        <text x="106" y="46" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">92.1%</text>
      </g>

      <!-- Metric 3 -->
      <g transform="translate(360, 0)">
        <rect width="168" height="68" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1.2" />
        <text x="14" y="20" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Active Model Pods</text>
        <text x="14" y="46" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">32 / 32</text>
        <text x="95" y="46" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">100% OK</text>
      </g>

      <!-- Metric 4 -->
      <g transform="translate(540, 0)">
        <rect width="168" height="68" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1.2" />
        <text x="14" y="20" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Token Throughput</text>
        <text x="14" y="46" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">14.2k t/s</text>
        <text x="108" y="46" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">+18%</text>
      </g>
    </g>

    <!-- Center Multi-Series Chart (708px width) -->
    <g transform="translate(24, 150)">
      <rect width="708" height="195" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1.2" />
      <text x="18" y="24" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Token Throughput (t/s) vs Inference Latency (ms)</text>
      <text x="560" y="24" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10">● Throughput</text>
      <text x="640" y="24" fill="#f43f5e" font-family="-apple-system, sans-serif" font-size="10">● Latency</text>

      <!-- Chart grid -->
      <line x1="30" y1="55" x2="680" y2="55" stroke="#27272a" stroke-dasharray="3 3" />
      <line x1="30" y1="95" x2="680" y2="95" stroke="#27272a" stroke-dasharray="3 3" />
      <line x1="30" y1="135" x2="680" y2="135" stroke="#27272a" stroke-dasharray="3 3" />

      <!-- Cyan Area -->
      <path d="M 30 140 Q 120 110, 200 125 T 380 75 T 520 60 T 670 45 L 670 160 L 30 160 Z" fill="url(#zChartCyan)" />
      <!-- Cyan Line -->
      <path d="M 30 140 Q 120 110, 200 125 T 380 75 T 520 60 T 670 45" fill="none" stroke="#38bdf8" stroke-width="2.5" />

      <!-- Red Latency Line -->
      <path d="M 30 70 Q 120 85, 200 80 T 380 120 T 520 135 T 670 148" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 2" />

      <!-- Tooltip -->
      <g transform="translate(480, 32)">
        <rect width="130" height="22" rx="4" fill="#09090b" stroke="#38bdf8" stroke-width="1" />
        <text x="65" y="15" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">14,290 t/s • 12.8ms</text>
      </g>

      <!-- X-Axis -->
      <text x="30" y="178" fill="#71717a" font-family="-apple-system, sans-serif" font-size="9">14:00</text>
      <text x="160" y="178" fill="#71717a" font-family="-apple-system, sans-serif" font-size="9">14:15</text>
      <text x="290" y="178" fill="#71717a" font-family="-apple-system, sans-serif" font-size="9">14:30</text>
      <text x="420" y="178" fill="#71717a" font-family="-apple-system, sans-serif" font-size="9">14:45</text>
      <text x="550" y="178" fill="#71717a" font-family="-apple-system, sans-serif" font-size="9">15:00</text>
      <text x="655" y="178" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">NOW</text>
    </g>

    <!-- Bottom Nodes Table -->
    <g transform="translate(24, 358)">
      <rect width="708" height="182" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1.2" />

      <!-- Table Header -->
      <rect width="708" height="28" rx="8" fill="#27272a" />
      <rect y="18" width="708" height="10" fill="#27272a" />
      <text x="16" y="18" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">WORKER NODE</text>
      <text x="180" y="18" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">HARDWARE</text>
      <text x="320" y="18" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">TEMP</text>
      <text x="400" y="18" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">GPU LOAD</text>
      <text x="510" y="18" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">STATUS</text>
      <text x="620" y="18" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">ACTIONS</text>

      <!-- Row 1 -->
      <g transform="translate(16, 42)">
        <text x="0" y="12" fill="#ffffff" font-family="monospace" font-size="11" font-weight="600">us-east-h100-01</text>
        <text x="164" y="12" fill="#d4d4d8" font-family="-apple-system, sans-serif" font-size="11">8x H100 SXM5 80GB</text>
        <text x="304" y="12" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="11">64°C</text>
        <text x="384" y="12" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">94% VRAM</text>
        <rect x="494" y="0" width="60" height="18" rx="4" fill="#052e16" stroke="#16a34a" stroke-width="0.5" />
        <text x="524" y="12" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">ONLINE</text>
        <rect x="604" y="0" width="66" height="18" rx="4" fill="#27272a" />
        <text x="637" y="12" fill="#e4e4e7" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Telemetry</text>
      </g>
      <line x1="16" y1="72" x2="692" y2="72" stroke="#27272a" stroke-width="0.8" />

      <!-- Row 2 -->
      <g transform="translate(16, 82)">
        <text x="0" y="12" fill="#ffffff" font-family="monospace" font-size="11" font-weight="600">us-east-h100-02</text>
        <text x="164" y="12" fill="#d4d4d8" font-family="-apple-system, sans-serif" font-size="11">8x H100 SXM5 80GB</text>
        <text x="304" y="12" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="11">66°C</text>
        <text x="384" y="12" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">92% VRAM</text>
        <rect x="494" y="0" width="60" height="18" rx="4" fill="#052e16" stroke="#16a34a" stroke-width="0.5" />
        <text x="524" y="12" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">ONLINE</text>
        <rect x="604" y="0" width="66" height="18" rx="4" fill="#27272a" />
        <text x="637" y="12" fill="#e4e4e7" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Telemetry</text>
      </g>
      <line x1="16" y1="112" x2="692" y2="112" stroke="#27272a" stroke-width="0.8" />

      <!-- Row 3 -->
      <g transform="translate(16, 122)">
        <text x="0" y="12" fill="#ffffff" font-family="monospace" font-size="11" font-weight="600">us-east-h100-03</text>
        <text x="164" y="12" fill="#d4d4d8" font-family="-apple-system, sans-serif" font-size="11">8x H100 SXM5 80GB</text>
        <text x="304" y="12" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11">71°C</text>
        <text x="384" y="12" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">98% VRAM</text>
        <rect x="494" y="0" width="60" height="18" rx="4" fill="#052e16" stroke="#16a34a" stroke-width="0.5" />
        <text x="524" y="12" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">ONLINE</text>
        <rect x="604" y="0" width="66" height="18" rx="4" fill="#27272a" />
        <text x="637" y="12" fill="#e4e4e7" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Telemetry</text>
      </g>
    </g>
  </g>
</svg>
