<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="pduBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="360" rx="12" fill="#030712" stroke="#1f2937" stroke-width="1.5" />

  <!-- Column 1: Streamlit -->
  <g transform="translate(40, 30)">
    <rect width="280" height="300" rx="10" fill="url(#cardBg)" stroke="#374151" stroke-width="1.5" />
    <rect x="0" y="0" width="280" height="4" rx="2" fill="#ef4444" />
    <text x="24" y="34" fill="#f87171" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">STREAMLIT</text>
    <text x="24" y="60" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Script-Rerun Architecture</text>
    
    <text x="24" y="96" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="13">✓ Easy 10s Python DX</text>
    <text x="24" y="120" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="13">✓ pdu/st.write</text>
    
    <text x="24" y="160" fill="#f87171" font-family="-apple-system, sans-serif" font-size="13">✗ Reruns lines 1-100 on click</text>
    <text x="24" y="184" fill="#f87171" font-family="-apple-system, sans-serif" font-size="13">✗ Tornado (Cannot mount in FastAPI)</text>
    <text x="24" y="208" fill="#f87171" font-family="-apple-system, sans-serif" font-size="13">✗ No built-in REST API /docs</text>
    <text x="24" y="232" fill="#f87171" font-family="-apple-system, sans-serif" font-size="13">✗ Basic, rigid styling</text>
    
    <rect x="24" y="260" width="232" height="26" rx="6" fill="#374151" />
    <text x="140" y="277" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Slow under user interaction</text>
  </g>

  <!-- Column 2: Next.js + FastAPI -->
  <g transform="translate(360, 30)">
    <rect width="280" height="300" rx="10" fill="url(#cardBg)" stroke="#374151" stroke-width="1.5" />
    <rect x="0" y="0" width="280" height="4" rx="2" fill="#eab308" />
    <text x="24" y="34" fill="#fde047" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">NEXT.JS + FASTAPI</text>
    <text x="24" y="60" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Dual-Stack Architecture</text>
    
    <text x="24" y="96" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="13">✓ Production Performance</text>
    <text x="24" y="120" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="13">✓ Multi-page App Router</text>
    
    <text x="24" y="160" fill="#f87171" font-family="-apple-system, sans-serif" font-size="13">✗ 2 Languages (TS + Python)</text>
    <text x="24" y="184" fill="#f87171" font-family="-apple-system, sans-serif" font-size="13">✗ 450 MB node_modules</text>
    <text x="24" y="208" fill="#f87171" font-family="-apple-system, sans-serif" font-size="13">✗ CORS &amp; API schema drift</text>
    <text x="24" y="232" fill="#f87171" font-family="-apple-system, sans-serif" font-size="13">✗ 15-45ms HTTP network hop</text>
    
    <rect x="24" y="260" width="232" height="26" rx="6" fill="#374151" />
    <text x="140" y="277" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">High cognitive &amp; build tax</text>
  </g>

  <!-- Column 3: PyDataUI (Hero) -->
  <g transform="translate(680, 20)">
    <rect width="280" height="320" rx="12" fill="url(#pduBg)" stroke="#6366f1" stroke-width="2" />
    <rect x="0" y="0" width="280" height="6" rx="3" fill="#6366f1" />
    <text x="24" y="36" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="14" font-weight="800">⚡ PYDATAUI (v1.3.0)</text>
    <text x="24" y="62" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">The Best of Both Worlds</text>
    
    <text x="24" y="98" fill="#34d399" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">✓ 10s Streamlit DX (pdu.write)</text>
    <text x="24" y="122" fill="#34d399" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">✓ 0 Full-Script Re-runs (HTMX SSR)</text>
    <text x="24" y="146" fill="#34d399" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">✓ 0ms In-Memory Model Access</text>
    <text x="24" y="170" fill="#34d399" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">✓ Native FastAPI Mountable</text>
    <text x="24" y="194" fill="#34d399" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">✓ Auto Swagger UI at /docs</text>
    <text x="24" y="218" fill="#34d399" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">✓ 20 Themes &amp; Custom Palettes</text>
    <text x="24" y="242" fill="#34d399" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">✓ 0 KB Client JS Bundle (Zero npm)</text>
    
    <rect x="24" y="270" width="232" height="32" rx="8" fill="#4338ca" />
    <text x="140" y="291" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Ship in Days, Not Weeks 🚀</text>
  </g>
</svg>
