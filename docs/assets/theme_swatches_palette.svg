<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="swBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="1000" height="240" rx="12" fill="url(#swBg)" stroke="#1f2937" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(30, 24)">
    <text x="0" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">
      20 Official Built-in Color Presets
    </text>
    <text x="0" y="34" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">
      Pass any preset directly: <tspan fill="#a5b4fc" font-family="monospace">pdu.set_page_config(theme="violet")</tspan> — or provide custom hex codes / dict palettes.
    </text>
  </g>

  <!-- Row 1: 10 Themes -->
  <g transform="translate(30, 75)">
    <!-- 1: zinc -->
    <g transform="translate(0, 0)">
      <rect width="86" height="52" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
      <circle cx="16" cy="18" r="5" fill="#fafafa" />
      <text x="12" y="42" fill="#fafafa" font-family="monospace" font-size="11" font-weight="700">zinc</text>
    </g>

