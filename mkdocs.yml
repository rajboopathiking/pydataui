site_name: PyDataUI
site_description: "A Full-Stack Python Framework for Data and AI Applications with a Compiled Rust HTTP Core"
site_author: "Boopathi Raj"
site_url: "https://rajboopathiking.github.io/pydataui/"
repo_url: "https://github.com/rajboopathiking/pydataui"
repo_name: "rajboopathiking/pydataui"

exclude_docs: |
  README.md
  VERIFICATION_*.json

theme:
  name: material
  language: en
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - def_list

nav:
  - Home: index.md
  - Benchmarks: BENCHMARKS.md
  - Guides:
      - Full HTML Documentation: FULL_HTML_DOCUMENTATION.md
      - Mobile Optimization & Architecture: MOBILE_OPTIMIZATION_AND_ARCHITECTURE.md
      - FastAPI Mounting & Conflicts: FASTAPI_MOUNTING_AND_CONFLICTS.md
      - Mobile & Desktop Apps: MOBILE_AND_DESKTOP.md
      - Documentation & HTML Guide: DOCS_DEVELOPER_GUIDE.md
      - Authentication & Security: AUTHENTICATION.md
      - UI Customization & Tailwind: CUSTOMIZATION.md
      - Data Science Components: DATA_COMPONENTS.md
      - Data Team Templates: DATA_TEMPLATES.md
      - Production Deployment: DEPLOYMENT.md
      - Production Readiness: PRODUCTION_READINESS.md
      - Troubleshooting: TROUBLESHOOTING.md
  - Reference:
      - Template Gallery: TEMPLATE_GALLERY.md
      - HTML Reference: HTML_REFERENCE.md
      - CSS Reference: CSS_REFERENCE.md
      - API Reference: API_REFERENCE.md
      - Quick Reference: QUICKREF.md
      - Migration Guide (v0.3.0): MIGRATION_0_3_0.md
      - Migration Guide (v0.2.1): MIGRATION_0_2_1.md
