[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pydataui"
version = "0.2.0"
description = "A production-grade full-stack Python framework for data roles powered by pyrustapi, HTMX, Tailwind CSS, and shadcn/ui."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Boopathi Raj", email = "rajboopathiking@gmail.com"}]
requires-python = ">=3.9"
dependencies = [
    "pyrustapi>=1.8.0",
    "PyJWT>=2.8.0",
    "pydantic>=2.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
data = [
    "pandas>=1.5.0",
    "plotly>=5.0.0",
    "pyarrow",
]
tunnel = [
    "pyngrok>=7.0.0",
]
dev = [
    "pytest>=7.0.0",
    "anyio>=4.0.0",
    "pandas>=1.5.0",
    "plotly>=5.0.0",
]
all = [
    "pandas>=1.5.0",
    "plotly>=5.0.0",
    "pyarrow",
    "pyngrok>=7.0.0",
]

[project.scripts]
pydataui = "pydataui.cli.main:main"

[tool.setuptools.packages.find]
include = ["pydataui*"]

[tool.setuptools.package-data]
pydataui = ["styling/css/*.css", "styling/js/*.js"]
