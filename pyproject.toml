[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pydataui"
version = "0.3.3"
description = "A full-stack Python framework for data and AI applications."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Boopathi Raj", email = "rajboopathiking@gmail.com"}]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "starlette>=0.27.0",
    "httpx>=0.24.0",
    "PyJWT>=2.8.0,<3",
    "pydantic>=2.0.0,<3",
    "markdown>=3.4",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
pyrustapi = ["pyrustapi>=1.8.9,<2"]
browser = ["playwright>=1.49,<2"]
postgres = [
    "psycopg[binary]>=3.1.0",
]
data = [
    "pandas>=1.5.0",
    "plotly>=5.0.0",
    "pyarrow",
]
tunnel = [
    "pyngrok>=7.0.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.0",
]
dev = [
    "pytest>=7.0.0",
    "anyio>=4.0.0",
    "pandas>=1.5.0",
    "plotly>=5.0.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
all = [
    "pandas>=1.5.0",
    "plotly>=5.0.0",
    "pyarrow",
    "pyngrok>=7.0.0",
    "psycopg[binary]>=3.1.0",
]

[project.scripts]
pydataui = "pydataui.cli.main:main"

[tool.setuptools.packages.find]
include = ["pydataui*"]

[tool.setuptools.package-data]
pydataui = ["styling/css/*.css", "styling/js/*.js"]
